services:
  - type: web
    name: pda-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /health
    envVars:
      # Database is hosted on Supabase, not on Render — paste the connection
      # string from the Supabase dashboard (Project Settings → Database →
      # Connection string → URI, "Direct connection", port 5432) into this
      # env var on Render's dashboard after the first deploy. Keep it out of
      # git; that's what `sync: false` means here.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Frontend lives on GitHub Pages (see .github/workflows/deploy-pages.yml),
      # not on Render — update these two if the GitHub org/repo name changes.
      - key: CORS_ORIGINS
        value: https://catzzrule.github.io
      - key: STORAGE_DIR
        value: /app/storage
      - key: PUBLIC_BASE_URL
        value: https://pda-backend.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://catzzrule.github.io/PDA---teste-1-novo-
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: "none"
      - key: SEED_MASTER_EMAIL
        sync: false
      - key: SEED_MASTER_PASSWORD
        sync: false
