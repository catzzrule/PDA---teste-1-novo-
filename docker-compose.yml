services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pda
      POSTGRES_PASSWORD: pda
      POSTGRES_DB: pda
    ports:
      - "5432:5432"
    volumes:
      - pda_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pda"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://pda:pda@db:5432/pda
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGINS: http://localhost:5173
      STORAGE_DIR: /app/storage
      PUBLIC_BASE_URL: http://localhost:8000
      FRONTEND_BASE_URL: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - pda_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - pda_frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pda_db_data:
  pda_storage:
  pda_frontend_node_modules:
